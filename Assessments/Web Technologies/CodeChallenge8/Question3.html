<!DOCTYPE html>
<html lang="en" xmlns="http://www.w3.org/1999/xhtml">
<head>
    <meta charset="utf-8" />
    <title>Button Click Event</title>
</head>
<body>

    <button id="btn">Click me</button>

    <script>

        document.getElementById("btn").addEventListener("click", function () {
            console.log("Button Clicked");
        });

    </script>

</body>
</html>
